[project]
name = "filemind"
version = "0.1.0.dev1"
description = "Windows 桌面个人文件智能管理系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials>=6.12,<6.13"]

[project.gui-scripts]
filemind = "filemind.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
